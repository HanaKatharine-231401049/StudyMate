name: studymate
description: Studymate app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
  fonts:
    - family: MontserratAlternates
      fonts:
        - asset: fonts/MontserratAlternates-SemiBold.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-SemiBold.ttf
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-SemiBold.ttf
        - asset: fonts/Roboto-Regular.ttf